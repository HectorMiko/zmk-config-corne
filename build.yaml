# This file generates the GitHub Actions matrix.
# For simple board + shield combinations, add them to the top level board and
# shield arrays, for more control, add individual board + shield combinations
# to the `include` property. You can also use the `cmake-args` property to
# pass flags to the build command, `snippet` to add a Zephyr snippet, and
# `artifact-name` to assign a name to distinguish build outputs from each other:
#
# board: [ "nice_nano" ]
# shield: [ "corne_left", "corne_right" ]
# include:
#   - board: bdn9_rev2
#   - board: nice_nano
#     shield: reviung41
#   - board: nice_nano
#     shield: corne_left
#     snippet: studio-rpc-usb-uart
#     cmake-args: -DCONFIG_ZMK_STUDIO=y
#     artifact-name: corne_left_with_studio
#
---

include:
  - board: nice_nano_v2
    shield: corne_left nice_view_adapter nice_view_gem
    snippet: studio-rpc-usb-uart
  - board: nice_nano_v2
    shield: corne_right nice_view_adapter nice_view_gem
    # Diagnostic affichage (2026-08-30) : logs sur la moitie DROITE seulement.
    # La gauche ne peut pas, le snippet studio-rpc-usb-uart y occupe deja le
    # CDC ACM. A RETIRER une fois le bug trouve (consommation + RAM).
    #
    # Il faut le snippet, pas -DCONFIG_ZMK_USB_LOGGING=y : le symbole seul
    # y-selecte USB_CDC_ACM dont la dependance DT_HAS_ZEPHYR_CDC_ACM_UART_ENABLED
    # n'est pas satisfaite sur la peripherique, et Kconfig abandonne. Le snippet
    # ajoute le noeud zephyr,cdc-acm-uart sous zephyr_udc0 en plus du CONFIG.
    snippet: zmk-usb-logging
    # Le flot <dbg> de ZMK (kscan, split) noie tout et fait deborder les 8 Ko
    # de LOG_BUFFER_SIZE : on le coupe et on allume le log cote affichage.
    # Via cmake-args et non corne.conf : ces symboles dependent de CONFIG_LOG,
    # absent sur la gauche, ou l'assignation deviendrait un warning Kconfig
    # fatal. ZMK_LOGGING_MINIMAL est necessaire pour neutraliser le
    # "config ZMK_LOG_LEVEL default 4" de ZMK, qui precede le choix dans
    # app/Kconfig et gagnerait donc sur ZMK_LOG_LEVEL_WRN.
    cmake-args: >-
      -DCONFIG_ZMK_LOGGING_MINIMAL=y
      -DCONFIG_ZMK_LOG_LEVEL_WRN=y
      -DCONFIG_LV_USE_LOG=y
      -DCONFIG_LV_LOG_LEVEL_WARN=y
      -DCONFIG_DISPLAY_LOG_LEVEL_DBG=y
