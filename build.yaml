# This file generates the GitHub Actions matrix.
# For simple board + shield combinations, add them to the top level board and
# shield arrays, for more control, add individual board + shield combinations
# to the `include` property. You can also use the `cmake-args` property to
# pass flags to the build command, `snippet` to add a Zephyr snippet, and
# `artifact-name` to assign a name to distinguish build outputs from each other:
#
# board: [ "nice_nano" ]
# shield: [ "corne_left", "corne_right" ]
# include:
#   - board: bdn9_rev2
#   - board: nice_nano
#     shield: reviung41
#   - board: nice_nano
#     shield: corne_left
#     snippet: studio-rpc-usb-uart
#     cmake-args: -DCONFIG_ZMK_STUDIO=y
#     artifact-name: corne_left_with_studio
#
---

include:
  - board: nice_nano_v2
    shield: corne_left nice_view_adapter nice_view_gem
    snippet: studio-rpc-usb-uart
  - board: nice_nano_v2
    shield: corne_right nice_view_adapter nice_view_gem

  # Filet de securite : si le CS seul ne suffisait pas, ceux-ci ajoutent le
  # reste du corne.conf de Mechboards (underglow, puissance BT, animation).
  # A ignorer si les deux firmwares ci-dessus suffisent.
  - board: nice_nano_v2
    shield: corne_left nice_view_adapter nice_view_gem
    snippet: studio-rpc-usb-uart
    cmake-args: >-
      -DCONFIG_ZMK_RGB_UNDERGLOW=y
      -DCONFIG_WS2812_STRIP=y
      -DCONFIG_ZMK_RGB_UNDERGLOW_BRT_MAX=25
      -DCONFIG_BT_CTLR_TX_PWR_PLUS_8=y
      -DCONFIG_NICE_VIEW_GEM_ANIMATION=n
    artifact-name: fallback-mechboards-conf-left
  - board: nice_nano_v2
    shield: corne_right nice_view_adapter nice_view_gem
    cmake-args: >-
      -DCONFIG_ZMK_RGB_UNDERGLOW=y
      -DCONFIG_WS2812_STRIP=y
      -DCONFIG_ZMK_RGB_UNDERGLOW_BRT_MAX=25
      -DCONFIG_BT_CTLR_TX_PWR_PLUS_8=y
      -DCONFIG_NICE_VIEW_GEM_ANIMATION=n
    artifact-name: fallback-mechboards-conf-right
