# This file generates the GitHub Actions matrix.
# For simple board + shield combinations, add them to the top level board and
# shield arrays, for more control, add individual board + shield combinations
# to the `include` property. You can also use the `cmake-args` property to
# pass flags to the build command, `snippet` to add a Zephyr snippet, and
# `artifact-name` to assign a name to distinguish build outputs from each other:
#
# board: [ "nice_nano" ]
# shield: [ "corne_left", "corne_right" ]
# include:
#   - board: bdn9_rev2
#   - board: nice_nano
#     shield: reviung41
#   - board: nice_nano
#     shield: corne_left
#     snippet: studio-rpc-usb-uart
#     cmake-args: -DCONFIG_ZMK_STUDIO=y
#     artifact-name: corne_left_with_studio
#
---

include:
  # ===== M. Configuration Mechboards reproduite, avec NOTRE keymap. =====
  # Leur firmware pilote nos ecrans ; le seul ecart restant est le keymap.
  - board: nice_nano_v2
    shield: corne_left nice_view_adapter nice_view_gem
    snippet: studio-rpc-usb-uart
    artifact-name: M-mechboards-left
  - board: nice_nano_v2
    shield: corne_right nice_view_adapter nice_view_gem
    artifact-name: M-mechboards-right

  # ===== E. Notre conf minimale d'origine + la seule alimentation externe. =====
  # ZMK_EXT_POWER n'apparait qu'une fois dans app/Kconfig, sans default y :
  # rien ne l'active, donc ext_power_generic.c n'est meme pas compile et
  # P0.13 n'est jamais pilote. Or sur le nice!nano v2 cette broche commande
  # le MOSFET du rail VCC, celui qui alimente l'ecran. Si M marche et E
  # aussi, la cause est la, en une ligne.
  - board: nice_nano_v2
    shield: corne_left nice_view_adapter nice_view_gem
    snippet: studio-rpc-usb-uart
    cmake-args: >-
      -DCONFIG_ZMK_RGB_UNDERGLOW=n
      -DCONFIG_WS2812_STRIP=n
      -DCONFIG_ZMK_EXT_POWER=y
    artifact-name: E-extpower-left
  - board: nice_nano_v2
    shield: corne_right nice_view_adapter nice_view_gem
    cmake-args: >-
      -DCONFIG_ZMK_RGB_UNDERGLOW=n
      -DCONFIG_WS2812_STRIP=n
      -DCONFIG_ZMK_EXT_POWER=y
    artifact-name: E-extpower-right
