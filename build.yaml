# This file generates the GitHub Actions matrix.
# For simple board + shield combinations, add them to the top level board and
# shield arrays, for more control, add individual board + shield combinations
# to the `include` property. You can also use the `cmake-args` property to
# pass flags to the build command, `snippet` to add a Zephyr snippet, and
# `artifact-name` to assign a name to distinguish build outputs from each other:
#
# board: [ "nice_nano" ]
# shield: [ "corne_left", "corne_right" ]
# include:
#   - board: bdn9_rev2
#   - board: nice_nano
#     shield: reviung41
#   - board: nice_nano
#     shield: corne_left
#     snippet: studio-rpc-usb-uart
#     cmake-args: -DCONFIG_ZMK_STUDIO=y
#     artifact-name: corne_left_with_studio
#
---

include:
  # ===== A. gem + Studio : la configuration actuelle. =====
  # A-gem-right-debug porte LV_USE_LOG et DISPLAY_LOG_LEVEL_DBG : c'est le
  # firmware qui dira si la moindre trame atteint l'ecran (<dbg> ls0xx: X/Y/W/H
  # depuis ls0xx_write). Rien d'autre ne permet de trancher entre "le firmware
  # n'envoie rien" et "il envoie mais l'ecran ne recoit pas".
  - board: nice_nano_v2
    shield: corne_left nice_view_adapter nice_view_gem
    snippet: studio-rpc-usb-uart
    artifact-name: A-gem-left
  - board: nice_nano_v2
    shield: corne_right nice_view_adapter nice_view_gem
    snippet: zmk-usb-logging
    cmake-args: >-
      -DCONFIG_ZMK_LOGGING_MINIMAL=y
      -DCONFIG_ZMK_LOG_LEVEL_WRN=y
      -DCONFIG_LV_USE_LOG=y
      -DCONFIG_LV_LOG_LEVEL_WARN=y
      -DCONFIG_DISPLAY_LOG_LEVEL_DBG=y
    artifact-name: A-gem-right-debug

  # ===== C. gem SANS ZMK Studio. =====
  # B (shield nice_view standard) a echoue comme A : le module d'affichage est
  # hors de cause. Reste ce que le firmware Mechboards n'avait certainement pas,
  # et qui est commun a A et B : CONFIG_ZMK_STUDIO=y, pose dans corne.conf donc
  # actif sur LES DEUX moities alors que le snippet RPC n'est que sur la gauche.
  # Sans le snippet Studio, le CDC ACM est libre a gauche : on en profite pour
  # journaliser aussi la centrale, qui porte l'ecran le plus charge.
  - board: nice_nano_v2
    shield: corne_left nice_view_adapter nice_view_gem
    snippet: zmk-usb-logging
    cmake-args: >-
      -DCONFIG_ZMK_STUDIO=n
      -DCONFIG_ZMK_LOGGING_MINIMAL=y
      -DCONFIG_ZMK_LOG_LEVEL_WRN=y
      -DCONFIG_LV_USE_LOG=y
      -DCONFIG_LV_LOG_LEVEL_WARN=y
      -DCONFIG_DISPLAY_LOG_LEVEL_DBG=y
    artifact-name: C-nostudio-left-debug
  - board: nice_nano_v2
    shield: corne_right nice_view_adapter nice_view_gem
    snippet: zmk-usb-logging
    cmake-args: >-
      -DCONFIG_ZMK_STUDIO=n
      -DCONFIG_ZMK_LOGGING_MINIMAL=y
      -DCONFIG_ZMK_LOG_LEVEL_WRN=y
      -DCONFIG_LV_USE_LOG=y
      -DCONFIG_LV_LOG_LEVEL_WARN=y
      -DCONFIG_DISPLAY_LOG_LEVEL_DBG=y
    artifact-name: C-nostudio-right-debug
