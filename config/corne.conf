CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y
CONFIG_ZMK_STUDIO=y

# Mise en veille. Les trois lignes ci-dessous corrigent trois defauts amont
# qui, cumules, empechaient la batterie de tenir.
#
# 1. Veille profonde. ZMK_SLEEP n'a aucun "default" dans app/Kconfig de
#    v0.3, donc il vaut n : le clavier ne s'endort jamais vraiment. Il passe
#    en idle au bout de ZMK_IDLE_TIMEOUT (30 s par defaut), mais idle n'est
#    pas sleep -- la radio reste connectee et le MCU en veille legere, soit
#    quelques centaines de uA a ~1 mA contre ~10-20 uA en veille profonde.
#    C'est la cause dominante : elle vide la batterie clavier pose.
#    Sans cette ligne, ZMK_IDLE_SLEEP_TIMEOUT (900000 ms, 15 min) est du
#    code mort, il est declare dans un bloc "if ZMK_SLEEP".
CONFIG_ZMK_SLEEP=y

# 2. Animation du nice!view. NICE_VIEW_GEM_ANIMATION est "default y" dans le
#    Kconfig.defconfig du module, avec NICE_VIEW_GEM_ANIMATION_MS a 960. Le
#    MCU se reveillait donc ~62 fois par minute pour faire tourner LVGL et
#    pousser une trame 160x68 sur le SPI, sans aucun rapport avec la frappe.
#    Le libelle amont dit "on peripheral" : c'est la moitie droite qui
#    payait. build.yaml desactivait deja ce flag, mais seulement dans les
#    variantes fallback, celles qu'on ne flashe pas.
CONFIG_NICE_VIEW_GEM_ANIMATION=n

# 3. Extinction de l'ecran. ZMK_DISPLAY_BLANK_ON_IDLE est
#    "default y if SSD1306" dans app/src/display/Kconfig. Le nice!view est un
#    ls0xx (LCD a memoire Sharp), pas un SSD1306 : le symbole valait donc n
#    et l'ecran ne s'eteignait litteralement jamais. Le raisonnement amont se
#    defend pour la dalle (un LCD a memoire garde son image pour quelques uW)
#    mais ignore le cout du MCU qui maintient LVGL en vie.
#
#    Effet de bord a verifier, pose en hypothese : la dalle passant le plus
#    clair de son temps eteinte, l'accumulation de biais continu du bug VCOM
#    de v0.3 devrait ralentir, donc le fade aussi.
CONFIG_ZMK_DISPLAY_BLANK_ON_IDLE=y
