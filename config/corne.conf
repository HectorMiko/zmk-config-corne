CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y
CONFIG_ZMK_STUDIO=y

# --- Diagnostic affichage (2026-08-30) ---
# 1. Le thread UI dedie n'a que 2048 octets de pile en ZMK v0.3. ZMK l'a monte
#    a 4096 dans main (nice_view.conf) pour le nice!view *standard* ; gem est
#    plus lourd : 3 canvas 68x68 + un buffer temporaire dans rotate_canvas,
#    ~18 Ko statiques, et lv_canvas_transform sur la pile.
CONFIG_ZMK_DISPLAY_DEDICATED_THREAD_STACK_SIZE=4096
# 2. Pool d'objets LVGL. gem le fixe a 4096, valeur calibree sans ZMK Studio
#    dans le build. Une alloc LVGL qui echoue = dessin abandonne en silence,
#    ce qui laisse l'ecran a memoire figee sur un rendu partiel.
CONFIG_LV_Z_MEM_POOL_SIZE=8192
