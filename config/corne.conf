# Reprise a l'identique du corne.conf de Mechboards
# (MechboardsLTD/zmk-config, branche refresh_mips), dont le firmware pilote
# correctement nos nice!view. Seules les deux lignes EC11 sont omises : ce
# sont les encodeurs rotatifs, que nous n'avons pas, et elles exigeraient
# leurs overlays.
CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_WS2812_STRIP=y

CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y

CONFIG_ZMK_STUDIO_LOCKING=n
CONFIG_ZMK_STUDIO=y

CONFIG_ZMK_RGB_UNDERGLOW_BRT_MAX=25

CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

CONFIG_NICE_VIEW_GEM_ANIMATION=n
